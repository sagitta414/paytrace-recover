ytrace-agent-room .ar-avatar[data-shape="3"] i{width:21px;height:21px;border:5px solid currentColor;transform:rotate(45deg);border-radius:3px}#paytrace-agent-room .ar-agent h2{font-size:22px;letter-spacing:-.7px;font-weight:700}#paytrace-agent-room .ar-role{font-size:11px;color:var(--tone);font-weight:650;margin-top:2px}#paytrace-agent-room .ar-agent p{font-size:12px;color:var(--muted);margin-top:12px;min-height:38px}#paytrace-agent-room .ar-agent-bottom{border-top:1px solid var(--line);margin-top:15px;padding-top:12px;font-size:11px;display:flex;justify-content:space-between;gap:8px;color:var(--muted)}#paytrace-agent-room .ar-agent-bottom span:last-child{color:var(--tone)}

[{a:2,to:3,kind:'Evidence',text:'Jobs F-201 and F-202 reference the same order. The store processed the event twice.',e:2},{a:3,to:2,kind:'Challenge',text:'A duplicate job is not proof that a shipment can be canceled. Is carrier pickup visible in the supplied records?',e:2}],
[{a:2,to:3,kind:'Unknown',text:'Carrier pickup is not connected. I cannot establish whether either package has shipped.',e:2},{a:3,to:null,kind:'Recommendation',text:'Create a shipment review task. Keep cancellation pending until shipment status is verified. These records do not justify a refund.',e:2}]
],
[
[{a:0,to:1,kind:'Finding',text:'PayPal records a completed $45.00 refund against the $180.00 payment. Relay, follow the refund event.',e:0},{a:1,to:2,kind:'Handoff',text:'The store endpoint returned HTTP 503. It did not accept that delivery. Patch, compare the order’s refund record.',e:1}],
[{a:2,to:3,kind:'Evidence',text:'The store still records $180.00 net. Applying the existing refund would bring the net to $135.00.',e:2},{a:3,to:0,kind:'Challenge',text:'Does completed mean the customer can already see the credit in their bank account?',e:0}],
[{a:0,to:3,kind:'Unknown',text:'No. PayPal completion does not establish bank posting time. That remains unverified.',e:0},{a:3,to:null,kind:'Recommendation',text:'Record the completed refund in the store after matching its payment and order references. Do not issue a second refund.',e:2}]
]
];
const state={case:0,chapter:1,agent:3,inspector:'profile',evidence:1,review:false,done:[false,false,false]};
function restore(v){if(v?.version!==5)return;if([0,1,2].includes(v.case))state.case=v.case;if([0,1,2].includes(v.chapter))state.chapter=v.chapter;if([0,1,2,3].includes(v.agent))state.agent=v.agent;if(['profile','evidence'].includes(v.inspector))state.inspector=v.inspector;if([0,1,2].includes(v.evidence))state.evidence=v.evidence;state.review=!!v.review;if(v.done?.length===3)state.done=v.done.map(Boolean)}restore(window.openai?.widgetState?.modelContent);
function save(){window.openai?.setWidgetState?.({modelContent:{version:5,...state},privateContent:null})?.catch(()=>{})}
function avatar(i){return `<span class="ar-avatar" data-tone="${i}" data-shape="${i}" aria-hidden="true"><i></i></span>`}
function evidence(){const c=cases[state.case];return [
{name:state.case===2?'Completed refund':'Completed capture',source:'PayPal sample record',time:c.paypal[1][0],value:c.paypal[1][2],note:state.case===2?'$180.00 original payment · $45.00 refund':'The sample record links this payment to order #'+c.id},
{name:'Event delivery',source:'PayPal event + store response',time:c.paypal[2][0],value:c.paypal[2][2],note:c.store[1][2]},
{name:'Store processing',source:'Merchant sample log',time:c.store[2][0],value:c.store[2][2],note:c.store[2][1]}
]}
function inspector(){if(state.inspector==='evidence'){const e=evidence()[state.evidence];return `<aside class="ar-inspector" aria-live="polite"><div class="ar-eyebrow">Evidence / source record</div><div class="ar-evidence-number">0${state.evidence+1}</div><h2>${e.name}</h2><div class="ar-job">${e.source}</div><div class="ar-detail"><span>Recorded at</span><strong>${e.time}</strong></div><div class="ar-detail"><span>Observed value</span><div class="ar-record-value">${e.value}</div></div><p>${e.note}</p><small>Illustrative record · ORDER-${cases[state.case].id}<br>Source evidence supports the finding; agent agreement alone does not.</small><button class="ar-quiet cursor-interaction" data-profile>Back to agent profile</button></aside>`}const a=agents[state.agent];return `<aside class="ar-inspector" aria-live="polite"><div class="ar-eyebrow">Agent dossier / 0${state.agent+1}</div>${avatar(state.agent)}<h2>${a.name}</h2><div class="ar-job">${a.role} · AI specialist</div><p>${a.question}</p><div class="ar-detail"><span>Investigates</span><strong>${a.scope}</strong></div><div class="ar-detail"><span>Consultation role</span><strong>${a.consult}</strong></div><div class="ar-detail"><span>Boundary</span><strong>${a.limit}</strong></div><button class="ar-quiet cursor-interaction" data-agent-consult="${state.agent}">View ${a.name}’s consultation ↗</button></aside>`}
function message(m,i){return `<article class="ar-message" data-tone="${m.a}"><div class="ar-message-head">${avatar(m.a)}<strong>${agents[m.a].name}</strong><span class="ar-recipient">→ ${m.to===null?'Merchant':agents[m.to].name}</span><span class="ar-kind">${m.kind}</span></div><p>${m.text}</p><button class="ar-source cursor-interaction" data-source="${m.e}">0${m.e+1} · ${evidence()[m.e].name}<span aria-hidden="true">↗</span></button></article>${i===0?'<div class="ar-handoff">↓ Consultation passed to the next specialist</div>':''}`}
function decision(){const c=cases[state.case];return `<section class="ar-decision" aria-label="Merchant action review"><div class="ar-decision-top"><div><div class="ar-eyebrow">Prism / reviewed recommendation</div><h2>${c.next}</h2></div><button class="ar-quiet cursor-interaction" data-close>Close</button></div><div class="ar-decision-grid"><div><div class="ar-decision-label">Proposed change</div><p>${c.preview}</p><div class="ar-impact">Existing payment only · No new charge or refund</div><button class="ar-primary cursor-interaction" data-approve ${state.done[state.case]?'disabled':''}>${state.done[state.case]?'Mock action recorded':'Approve mock action'} <span aria-hidden="true">→</span></button></div><div><div class="ar-decision-label">Still unknown</div><p>${c.uncertainty}</p><div class="ar-decision-label" style="margin-top:20px">Before execution</div><p>${state.case===1?'Confirm shipment status before any cancellation.':'Match payment and order references, amount, and currency; confirm the correction has not already been applied.'}</p></div></div>${state.done[state.case]?`<div class="ar-success" role="status">${c.done}</div>`:''}</section>`}
function render(){const c=cases[state.case];root.innerHTML=`<header class="ar-top"><div class="ar-brand"><img src="${mark}" alt="">PayTrace</div><span class="ar-tagline">Follow the payment. Find the why.</span><span class="ar-demo">Agent room / simulated demo</span></header><main class="ar-main"><div class="ar-title"><div><div class="ar-eyebrow">Your investigation team</div><h1>Different perspectives.<br><span>One connected story.</span></h1><p>Select a specialist. Follow the consultation. Inspect the evidence.</p></div><label><span class="ar-eyebrow" style="display:block;margin-bottom:7px">Sample case</span><select class="cursor-interaction" aria-label="Sample case">${cases.map((v,i)=>`<option value="${i}" ${state.case===i?'selected':''}>#${v.id} · ${v.label}</option>`).join('')}</select></label></div><section class="ar-team" aria-label="AI specialist team">${agents.map((a,i)=>`<button class="ar-agent cursor-interaction" data-agent="${i}" data-tone="${i}" aria-pressed="${state.agent===i}"><div class="ar-agent-top">${avatar(i)}<span>AI / 0${i+1}</span></div><h2>${a.name}</h2><div class="ar-role">${a.role}</div><p>${a.tag}</p><div class="ar-agent-bottom"><span>${a.status}</span><span aria-hidden="true">↗</span></div></button>`).join('')}</section><div class="ar-case"><div><strong>#${c.id} · ${c.name}</strong><p>${c.quote}</p></div><div class="ar-money"><img src="${paypal}" alt="PayPal">${c.amount}</div></div><div class="ar-work"><section class="ar-thread"><div class="ar-thread-head"><h2>The consultation</h2><span>Recorded sample exchange</span></div><nav class="ar-chapters" aria-label="Consultation chapters">${['Establish facts','Challenge findings','Recommend action'].map((v,i)=>`<button class="cursor-interaction" data-chapter="${i}" aria-pressed="${state.chapter===i}">${v}</button>`).join('')}</nav><div aria-live="polite">${scripts[state.case][state.chapter].map(message).join('')}</div><div class="ar-controls"><button class="ar-quiet cursor-interaction" data-prev ${state.chapter===0?'disabled':''}>← Back</button><span>${state.chapter+1} / 3</span><button class="ar-primary cursor-interaction" ${state.chapter===2?'data-review':'data-next'}>${state.chapter===2?'Review action':'Next exchange'} <span aria-hidden="true">→</span></button></div></section>${inspector()}</div>${state.review?decision():''}<footer class="ar-footer"><span>Four specialists · Source-backed findings · Merchant approval</span><span>Simulated AI & records · Independent PayPal concept</span></footer></main>`;
root.querySelectorAll('[data-agent]').forEach(b=>b.onclick=()=>{state.agent=+b.dataset.agent;state.inspector='profile';render();save();focus('[data-agent="'+state.agent+'"]')});root.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{state.chapter=+b.dataset.chapter;state.review=false;render();save();focus('[data-chapter="'+state.chapter+'"]')});root.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{state.evidence=+b.dataset.source;state.inspector='evidence';render();save();if(root.clientWidth<620)root.querySelector('.ar-inspector').scrollIntoView({block:'nearest'});focus('[data-profile]')});root.querySelector('[data-profile]')?.addEventListener('click',()=>{state.inspector='profile';render();save();focus('[data-agent-consult]')});root.querySelector('[data-agent-consult]')?.addEventListener('click',()=>{state.chapter=state.agent<2?0:state.agent===2?1:2;state.review=false;render();save();root.querySelector('.ar-thread').scrollIntoView({block:'nearest'});focus('[data-chapter="'+state.chapter+'"]')});root.querySelector('[data-prev]').onclick=()=>{state.chapter=Math.max(0,state.chapter-1);state.review=false;render();save();focus('[data-prev]')};root.querySelector('[data-next]')?.addEventListener('click',()=>{state.chapter=Math.min(2,state.chapter+1);state.review=false;render();save();focus('[data-chapter="'+state.chapter+'"]')});root.querySelector('[data-review]')?.addEventListener('click',()=>{state.review=true;render();save();root.querySelector('.ar-decision').scrollIntoView({block:'nearest'});focus('[data-close]')});root.querySelector('[data-close]')?.addEventListener('click',()=>{state.review=false;render();save();focus('[data-review]')});root.querySelector('[data-approve]')?.addEventListener('click',()=>{state.done[state.case]=true;render();save()});root.querySelector('select').onchange=e=>{state.case=+e.target.value;state.chapter=0;state.review=false;state.inspector='profile';render();save();focus('select')};}
function focus(selector){requestAnimationFrame(()=>root.querySelector(selector)?.focus({preventScroll:true}))}render();window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.modelContent;if(v?.version===5){restore(v);render()}});if(globalThis.Tweak){const d={corners:22};const t=new Tweak({container:root,onChange:()=>root.style.borderRadius=d.corners+'px'});t.addSlider(d,'corners',{label:'Window corners',min:0,max:28,unit:'px'})}
})();
</script>
